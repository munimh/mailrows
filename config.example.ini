; mailrows settings. Copy this file to config.ini and fill it in.
; config.ini is listed in .gitignore: never commit it.
;
; Any value can come from an environment variable instead, named MAILROWS_<SECTION>_<KEY>,
; for example MAILROWS_SMTP_PASSWORD or MAILROWS_AIRTABLE_TOKEN. The variable wins.
; Paths are relative to this file's folder.

[input]
file = events.csv
; for an .xlsx file with several tabs, the tab to read (default: the first)
sheet =
; which columns mean what
id_column = id
email_column = email
; mailrows writes progress here after each email. Leave blank to not touch the file.
status_column = status
; rows with any of these empty are skipped
required_columns = first_name, email

[template]
; first line "Subject: ...", then the body. Placeholders look like {first_name}.
text = template.txt
; optional HTML version with the same placeholders (leave blank for plain text only)
html =

[smtp]
host = smtp.example.com
port = 587
; ssl (usually port 465), starttls (usually 587) or none. 'mailrows smtp-check' finds the right one.
security = starttls
username = your.name@example.com
password = CHANGE_ME
timeout = 30

[sender]
from_name = Example Community Events
from_email = events@example.com
reply_to = hello@example.com
; optional: a copy of every real (not test) email goes here, invisibly
bcc =
; seconds to wait between emails
delay_seconds = 2

[log]
; the send log that stops anything going out twice. Keep it with the spreadsheet.
path = mailrows-log.sqlite3

[status]
; words written to the status column
sent = sent
pending = sent, update pending
unknown = check: may have been sent

[hooks]
; things to do after each email, comma separated: airtable, webhook, csv_append. Off by default.
enabled =

[airtable]
base_id = appXXXXXXXXXXXXXX
; table name or ID
table = Attendees
; the Airtable field to find the record by, and the spreadsheet column with the same value
match_field = Ticket ID
match_column = id
; personal access token with data.records:read and data.records:write on this base only
token = CHANGE_ME

[airtable.fields]
; Airtable field = value. {column} takes the value from the row. Built-ins: {_sent_at}, {_sent_date},
; {_row_id}, {_recipient}, {_subject}.
Invite status = Invited
Invite sent on = {_sent_date}

[webhook]
url = https://hooks.example.com/mailrows
; optional header, for example a shared secret
header_name =
header_value = CHANGE_ME
; columns to include in the JSON (default: all)
columns =

[csv_append]
path = sent-copy.csv
columns = id, email, _sent_at
